## スライド 1（表紙 — 人×デジタルで作る製造工程）[0:00-0:00.5]

こんにちは。今日は製造の仕事の話をします。ものを作る現場が、実際には何をしていて、どこが難しくて、そこにデジタルがどう入ってくるのか。それを味噌汁を題材に、手を動かしながら見ていきます。五十五分です。座って聞くだけの時間は短くて、半分以上は皆さんに考えてもらいます。よろしくお願いします。

→ スライド 2 へ切替

## スライド 2（製造の仕事）[0:00.5-0:02.5]

製造の仕事を一言でいうと、良いモノを安全・安定・ムダなく作り続けることです。

ムダなく、とは、決めた仕様のものを決めた数だけ、決めた時間とコストで、毎日ブレなく作ることです。実感がわきにくいので、料理に置き換えます。

図に、縦と横の流れがあります。

縦は、何をどう作るかを決める流れです。何を作るか考えて、レシピを決めて、一度作って味見する。ここまでが決める仕事です。

横は、モノが動く流れです。買い出しに行って、調理して、運んで、盛り付けて出す。

二つが交わるところが製造、料理でいえば調理です。決めたことと集めたモノが、ここで一つになります。製造の下には保全があります。コンロや鍋を整える仕事で、これが止まると調理も止まる。表に出ない土台です。

ここで終わりではありません。出てきた結果を見て、どうすればもっと良くなるかを振り返り、次のレシピや作り方を直します。電気代を減らせないか、もっと早く出せないか。これを考える部署や人が、実際に何人もいます。

これが製造の仕事です。どうでしょう、難しそうですか、簡単そうですか。

出てきたものを測る物差しが、図の下の五つです[R2]。品質、コスト、納期、安全、環境。頭文字をとって、キューシーディーエスイーと呼びます。料理なら、味や栄養や新鮮さ。電気代や材料費や人件費。注文から出てくるまでの時間。作る人が無事か。そして厨房が片付いているか、です。

→ スライド 3 へ切替

## スライド 3（製造の難しさ — 管理項目が多い）[0:02.5-0:03.5]

製造の難しさは、毎回ブレなく作るために管理する項目が多いことです。

同じ作り方をしても、毎回すこしずつ条件が変わります。その小さな変化も、いくつも積み重なると大きな変化になります。

そこで、ばらつく原因を分類して考えます。基本は四つで、人、機械、材料、方法です。ここに、測ること、それから環境を足して六つにしたものを、五エム一イーと呼びます[R1]。

いま出している図は、さきほどのキューシーディーエスイーのうち、キュー、品質の話です。魚の頭に「品質」と置いて、そこに向かって、品質がばらつく原因を六つに分けて並べています。これは製造一般の例です。品質のほかに、コストにも、納期にも、安全にも、環境にも、同じだけ管理する項目があります。魚の骨が、あと四つあるということです。

→ スライド 4 へ切替

## スライド 4（グループワーク①・20分）[0:03.5-0:05]

では、手を動かしてもらいます。味噌汁の味を毎回同じように出すにはどうすればいいかを、自分たちで考えてください。

題材は味噌汁です。ただし材料は三つだけ。豆腐と味噌と水です。これだけです。

やってもらうことは二つあります。一つ目は、味噌汁を作る工程のフローチャートを描くことです。開始から終了まで、どんな順番で何をするか。途中で判断が入るところがあれば、条件分岐も入れてください。皆さんは記号を習っていると思うので、そのまま使ってください。

二つ目は、味がばらつく原因を、さきほどの六つの分類で書き出すことです。魚の骨のような図で、頭のところに「同じ味噌汁なのに毎回味がブレる」と置いて、そこに向かって原因を並べていきます。

ホワイトボードと模造紙を使ってください。まずチームを組んでもらって、そこから二十分です。初めて会う人同士だと思うので、自己紹介から始めて構いません。分からなくなったら呼んでください。回ります。

→ スライド 5 へ切替

## スライド 5（解答例）[0:05-0:06.5]

（各自ワーク 20分。登壇者は巡回して個別に伴走する。以下の声かけは進行用であり、分量検算に含めない）

では、一つの例を見てみましょう。正解ではありません。皆さんが書いたものと見比べてください。

工程のほうを見てください。順番そのものより、途中に判断が入っているところに注目してください。味を見て、薄ければ味噌を足す。ここは決まった手順ではなく、その場で人が決めています。あとでこの話に戻ります。

原因のほうは、六つの骨それぞれに、思ったより多く並びます。人なら、作る人が違う、慣れているかどうか、目分量のクセ。機械ならコンロの火力のクセや鍋の厚み。材料なら豆腐の水切りの具合や水の硬さ。方法なら火にかける時間や味噌の溶き方。測ることなら計量の精度や味見する人の好み。環境なら厨房の温度や湿度です。

豆腐と味噌と水だけで、これだけあります。材料を三つに絞ってもこれなので、実際の料理はもっと増えます。

ここで二人に登場してもらいます。一人はこう言っています。単純な料理なのに、こんなにも管理する項目が多いんだ。もう一人はこうです。品質以外にも、コストや時間も管理せなあかんねん。

後のほうが大事です。いま皆さんが書き出したのは、味がブレる原因、つまり品質の話だけです。同じことを、コストについても、出てくる時間についても、安全についても、厨房の環境についても、それぞれ考える必要があります。魚の骨がもう四つ増えるということです。

→ スライド 6 へ切替

## スライド 6（製造におけるDX）[0:06.5-0:08.5]

ここからが後半です。管理項目がこれだけあると、人が全部覚えるやり方には限界があります。そこで出てくるのがデジタルです。

ディーエックス、デジタルトランスフォーメーションです。データとデジタル技術で、業務そのものを変えること、と定義されています[R4]。大事なのは「そのもの」です。

三段階で見ます。

一段目は、集めることです。魚の骨に書き出した原因を、そのまま記録します。何度で何分煮たか、味噌を何グラム入れたか、誰が作ったか。勘の中にあったものを、数字にします。

二段目は、つなぐことです。バラバラの記録を一つに集めて、味の良し悪しと突き合わせます。どういう条件のとき美味しくできたのかが見えてきます。

三段目が本題で、変えることです。これまでは、味見して自分で気づき、自分で火加減を変えていました。データを使うと、温度がずれたとセンサーが気づき、決めておいた通りに火加減が自動で変わります。人がやるのは、結果を確かめ、基準がずれていたら直すこと。家のコンロにも、熱くなりすぎると火が弱くなる仕組みが入っています。あれです。人の仕事が、動かすことから、基準を決めて確かめることに移る。これがディーエックスです。

間違えやすいところです。記録を取っただけ、紙をパソコンに置き換えただけでは、まだディーエックスではありません。仕事の流れ方と、人がやることが変わって初めて、やり方が変わったと言えます。

→ スライド 7 へ切替

## スライド 7（グループワーク②・10分）[0:08.5-0:09.5]

もう一度、手を動かしてもらいます。やることは二つです。

一つ目、さきほど描いた自分たちの工程図から、勘で決めている判断を見つけてください。二つ目、それをデータで決める形に書き換えてください。何を測れば決められるか、というところまで書けたら十分です。

ヒントを二つ出します。一つ目、フローチャートの中に「判断」のところがありますね。そこで皆さんは何を見て決めていますか。二つ目、その判断、勘ではなくて数字で決められませんか。

考える時間が五分、そのあと各チームから発表してもらうのに五分です。

→ スライド 8 へ切替

## スライド 8（解答例）[0:09.5-0:11]

（各自ワーク 10分＝考える5分・発表5分。登壇者は巡回する）

こちらも一つの例です。

さきほどの工程図に、線が増えているのが分かりますか。

たとえば温度です。鍋の温度をセンサーで測って、狙っている温度とどれだけずれているかを見て、火力を上げ下げする。測って、ずれたら戻す。これを機械が勝手にやってくれます。

もう一つは味です。塩分の濃さを測って、狙いより薄ければ味噌を足す量を決める。さきほどは人が味見をして決めていたところです。

増えた線が何をしているかというと、出てきた結果を、もう一度作り方に戻しています。作りっぱなしではなく、結果を見て次の一手を決める。これがさっきの三段目、決め方が変わるということです。

測って、狙いとのずれを見て、戻す。この形自体は、皆さんも見たことがあると思います。エアコンが設定温度を保つのも、車のクルーズコントロールが速度を保つのも、同じ形をしています。製造の現場でやっていることも、特別な何かではありません。

そして、人がいらなくなったわけではないことに注意してください。狙いの温度を何度にするか、どこまでずれたら直すのか、そもそも何を測ればいいのか。それを決めているのは人です。機械がやってくれるようになったのは、決めたあとの繰り返しの部分だけです。

→ スライド 9 へ切替

## スライド 9（日本の製造業がいま抱えている問題）[0:11-0:13]

ここまで料理で話してきました。実際の製造業に移ります。

いま、日本の製造業は三つの問題を抱えていると言われています【要裏取り】。

一つ目は人が足りないことです。少子高齢化で働き手が減り、若い人が製造の現場を選びにくくなっているとも言われます。きつい、汚い、危険という古いイメージが残っているからです。

二つ目は、管理のレベルが上がっていることです。会社が成長して作るものが増えると、見る項目が増えます。それだけでなく、管理のやり方そのものも高度になります。少ない数を多くの種類作る形に変わったことも効いています。

三つ目は、デジタル化が追いついていないことです。進めたくても、それをやる人がまた足りない。しかも現場は人によってやり方が違うことが多く、まず揃えるのが難しい。

三つは別々ではなく絡んでいます。人が減るから一人の受け持ちが広がり、管理が大変になる。大変だからデジタルを入れたいのに、それをやる人がいない。入らないから、また人に頼る。回っています。

つまり、人手は減っていくのに、管理することは増えていきます。この二つは逆を向いています。ここをどうするか、というのが今の製造業の課題です。

これは皆さんに関係のある話でもあります。いま現場で足りていないのは、機械を動かせる人ではなくて、何を測ってどう仕組みにするかを考えられる人です。皆さんが学校で学んでいることが、ちょうどそこに当たります。

→ スライド 10 へ切替

## スライド 10（人がする仕事と、デジタルがする仕事）[0:13-0:15]

そこで、人とデジタルで役割を分けます。

デジタルが得意なのは、決まったことを大量に、速く、正確に処理することです。同じ作業を何度繰り返しても疲れませんし、集めたデータから次に何が起きそうかを予測することもできます。さっきの、温度を測って火力を調整する、はまさにこれです。

一方で、人が得意なことは別にあります。そもそも何を作るのか、何ができたら良しとするのかを決めること。設備や製品を設計すること。関係する人たちの間で話をまとめること。そして、これは安全なのか、やっていいことなのかを判断すること。どれも、正解が一つに決まっていない仕事です。

そして、どちらか片方では成り立たない、重なっているところがあります。標準化と管理です。

標準化というのは、味噌の量を目分量ではなく何グラムと決めることです。決めるのは人です。どこまで細かく決めれば現場が回るかを判断できるのは人しかいません。ただ、決めたあと守られているかを見張り続けるのが管理で、こちらは人に向きません。そこはデジタルです。今日いちばん面白いのは、実はこの重なった部分だと思っています。

役割を分けると何が良いかというと、楽になって、速くなって、正確になります。ただ、人が減った分を機械で埋める、という話ではありません。人が、人にしかできない仕事のほうに動ける、という話です。

→ スライド 11 へ切替

## スライド 11（まとめ）[0:15-0:16.5＋エピソード]

今日の話をまとめます。

製造の仕事は、良いモノを安全に、安定して、ムダなく作り続けることでした。その難しさは、ブレずに作るための管理項目がとても多いことでした。豆腐と味噌と水だけの味噌汁で、あれだけ出てきましたね。

そこにデータを使って、仕事のやり方そのものを変えるのがディーエックスでした。そして、デジタルに任せられることは任せて、人は決めることや設計すること、判断することに向かう。標準化と管理は、その両方でやる。これが今日の話です。

最後に一つだけ。今日みなさんがやったのは、味噌汁を作ることではなくて、味噌汁の作り方を作ることでした。工程を描いて、ばらつく原因を探して、データで決め方を変える。製造はモノを作る仕事だと思われがちですが、本当のところは、作り方を作り、決めた通りに作って管理する仕事です。実際の現場は、今日の味噌汁よりずっと大きくて複雑です。それを面倒と思うか、面白いと思うか。それは今日やってみたみなさんが決めてください。今日はありがとうございました。

|---|---|---|---|---|
| （表紙 S1） | 153 | 0.51 | 0.5 | +2.0% |
| 1 単純に見えて、奥が深い（S2-S3） | 933 | 3.11 | 3.0 | +3.7% |
| 2 自分で描くと、もっと深い（S4-S5） | 979 | 3.26 | 3.25 | +0.4% |
| 3 だから、変えられる（S6-S8） | 1,366 | 4.55 | 4.5 | +1.2% |
| 4 それでも、人がやることがある（S9-S11） | 1,637 | 5.46 | 5.5 | -0.8% |
| **合計** | **5,068** | **16.89** | **16.75** | **+0.9%** |

※ 実測値（推定値は書かない）。**ワークの実施時間（20分・15分）・巡回・エピソード枠D（別資料へ切替）は無音時間として検算から除外**する。
※ 骨格の `data-minutes` は**この実測から引き直した**（S5 1.5→1.75 / S7 1.0→0.75 / S8 1.5→1.75）。合計は要件の55分と一致する。

## 要裏取り一覧

| スライド | 記述 | 状態 |
|---|---|---|
| S9 | 人材不足・高齢化／管理の複雑化／デジタル化の遅れ の三つ | 数字の一次出典は未確認。台本では「言われています」の形にとどめ、断定していない |
</script>

<script>
(function () {
  var raw = document.getElementById('src').textContent;
  var lines = raw.split('\n');
  var slides = []; var cur = null; var docTitle = '';
  var head = /^##\s*スライド\s*(\d+)\s*(?:[（(](.*?)[）)])?\s*(?:\[(.*?)\])?/;
  lines.forEach(function (line) {
    if (line.indexOf('# ') === 0 && !docTitle) { docTitle = line.replace(/^#\s*/, ''); return; }
    var m = line.match(head);
    if (m) { cur = { num: m[1], title: m[2] || '', time: m[3] || '', text: [] }; slides.push(cur); return; }
    // スライド以外の見出し(分量検算表・出典対応表・要裏取り一覧)で打ち切る。
    // これが無いと、最後のスライドの発話に検算用の表がぶら下がり読み上げてしまう。
    if (line.indexOf('## ') === 0) { cur = null; return; }
    if (!cur) return;
    var t = line.trim();
    if (!t || t === '---' || t.indexOf('→') === 0) return;   // 罫線と切替指示は発話ではない
    cur.text.push(t);
  });
  if (docTitle) document.getElementById('doctitle').textContent = docTitle;

  function clean(s) { return s.replace(/\[S\d+\]/g, '').replace(/\*\*/g, ''); }
  function sentences(s) {
    return clean(s).split(/(?<=[。!?！？])/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  // 長文はブラウザ側で途中打ち切りされるため、読点等で約80字以下の発話単位に割る
  function chunks(sen) {
    var MAX = 80;
    if (sen.length <= MAX) return [sen];
    var parts = sen.split(/(?<=[、,:：;；])/);
    var out = []; var buf = '';
    parts.forEach(function (p) {
      if (buf && (buf + p).length > MAX) { out.push(buf); buf = p; }
      else buf += p;
    });
    if (buf) out.push(buf);
    return out;
  }

  // 発話キュー: {slide, el, text}(el は文単位のハイライト対象。1文が複数発話に割れることがある)
  var queue = []; var slideEls = [];
  var main = document.getElementById('slides');
  slides.forEach(function (s, si) {
    var card = document.createElement('article');
    card.className = 'slide'; card.tabIndex = 0;
    card.innerHTML = '<div class="meta"><span class="num">S' + s.num + '</span><span>' + s.time + '</span></div>' +
      (s.title ? '<h2>' + s.title + '</h2>' : '');
    var p = document.createElement('p');
    s.text.forEach(function (para) {
      sentences(para).forEach(function (sen) {
        var span = document.createElement('span');
        span.className = 'sent'; span.textContent = sen;
        p.appendChild(span);
        chunks(sen).forEach(function (ch) {
          queue.push({ slide: si, el: span, text: ch });
        });
        // 文をタップ → その文の頭から再生(カード側のハンドラには渡さない)
        span.addEventListener('click', function (e) {
          e.stopPropagation();
          playFrom(firstOfEl(span));
        });
      });
    });
    card.appendChild(p);
    var hint = document.createElement('div');
    hint.className = 'hint'; hint.textContent = '文をタップ=その文から/ここをタップ=スライドの頭から再生';
    card.appendChild(hint);
    function startHere() { playFrom(firstOfSlide(si)); }
    card.addEventListener('click', startHere);
    card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startHere(); } });
    slideEls.push(card);
    main.appendChild(card);
  });
  function firstOfSlide(si) {
    for (var i = 0; i < queue.length; i++) if (queue[i].slide === si) return i;
    return 0;
  }
  function firstOfEl(el) {
    for (var i = 0; i < queue.length; i++) if (queue[i].el === el) return i;
    return 0;
  }

  var synth = window.speechSynthesis;
  var voiceSel = document.getElementById('voice');
  var jaVoices = [];
  function loadVoices() {
    jaVoices = (synth ? synth.getVoices() : []).filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('ja') === 0; });
    voiceSel.innerHTML = '';
    jaVoices.forEach(function (v, i) {
      var o = document.createElement('option');
      o.value = i; o.textContent = v.name;
      voiceSel.appendChild(o);
    });
    document.getElementById('novoice').style.display = jaVoices.length ? 'none' : 'inline';
  }
  loadVoices();
  if (synth) synth.onvoiceschanged = loadVoices;

  var idx = 0, playing = false, rate = 1.0;
  // session: 再生の世代番号。cancel() の完了通知は非同期に遅れて届くため、
  // 旧世代の onend/onerror が新しい再生の idx を進めないようこの番号で無効化する
  var session = 0;
  var currentUtterance = null; // iOS で GC されると onend が来なくなるため参照を保持
  var RATE_MIN = 0.5, RATE_MAX = 2.0, RATE_STEP = 0.25;
  var playBtn = document.getElementById('play');
  var status = document.getElementById('status');
  var rateVal = document.getElementById('rateVal');
  function fmtRate() { return parseFloat(rate.toFixed(2)) + '×'; }

  // 一部ブラウザは連続読み上げを一定時間で勝手に一時停止する。定期的に起こす
  setInterval(function () {
    if (playing && synth && synth.paused) synth.resume();
  }, 5000);

  function mark(i) {
    document.querySelectorAll('span.sent.speaking').forEach(function (e) { e.classList.remove('speaking'); });
    slideEls.forEach(function (e) { e.classList.remove('current'); });
    if (i < queue.length) {
      queue[i].el.classList.add('speaking');
      var card = slideEls[queue[i].slide];
      card.classList.add('current');
      var r = queue[i].el.getBoundingClientRect();
      if (r.top < 80 || r.bottom > window.innerHeight - 160) {
        queue[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      var s = slides[queue[i].slide];
      status.textContent = 'S' + s.num + ' / 全' + slides.length + '枚 ・ ' + fmtRate();
    }
  }
  function speakNext(mySession) {
    if (!playing || mySession !== session) return;
    if (idx >= queue.length) { stopAll(); status.textContent = '最後まで読み上げました'; return; }
    mark(idx);
    var u = new SpeechSynthesisUtterance(queue[idx].text);
    currentUtterance = u;
    u.lang = 'ja-JP'; u.rate = rate;
    var v = jaVoices[parseInt(voiceSel.value || '0', 10)];
    if (v) u.voice = v;
    u.onend = function () {
      if (!playing || mySession !== session) return; // 旧世代・停止後の通知は無視
      idx++; speakNext(mySession);
    };
    u.onerror = function (e) {
      if (!playing || mySession !== session) return;
      // cancel() 由来の通知では読み進めない(1文目スキップの原因)。実エラーのみ次へ
      if (e && (e.error === 'canceled' || e.error === 'interrupted')) return;
      idx++; speakNext(mySession);
    };
    synth.speak(u);
  }
  function playFrom(i) {
    if (!synth) { status.textContent = 'この環境では読み上げに対応していません'; return; }
    session++;
    var mySession = session;
    synth.cancel();
    idx = i; playing = true;
    playBtn.textContent = '⏸'; playBtn.setAttribute('aria-label', '一時停止');
    // cancel() 直後の speak() は無音で捨てられることがあるため、少し待ってから開始
    setTimeout(function () { speakNext(mySession); }, 250);
  }
  function stopAll() {
    playing = false;
    session++;
    if (synth) synth.cancel();
    playBtn.textContent = '▶'; playBtn.setAttribute('aria-label', '再生');
  }
  playBtn.addEventListener('click', function () {
    if (playing) {
      var si = queue[idx] ? queue[idx].slide : 0;
      stopAll();
      status.textContent = '一時停止(S' + slides[si].num + ' の途中)';
    } else playFrom(Math.min(idx, queue.length - 1));
  });
  document.getElementById('prev').addEventListener('click', function () {
    var si = queue[idx] ? queue[idx].slide : 0;
    playFrom(firstOfSlide(Math.max(0, si - 1)));
  });
  document.getElementById('next').addEventListener('click', function () {
    var si = queue[idx] ? queue[idx].slide : 0;
    playFrom(firstOfSlide(Math.min(slides.length - 1, si + 1)));
  });
  function setRate(next) {
    rate = Math.min(RATE_MAX, Math.max(RATE_MIN, Math.round(next * 100) / 100));
    rateVal.textContent = fmtRate();
    // 再生中は現在の発話を新しい速度で作り直して即反映する
    if (playing) playFrom(idx); else if (queue[idx]) mark(idx);
  }
  document.getElementById('rateDown').addEventListener('click', function () { setRate(rate - RATE_STEP); });
  document.getElementById('rateUp').addEventListener('click', function () { setRate(rate + RATE_STEP); });
})();
</script>
